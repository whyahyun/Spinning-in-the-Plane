<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Whyahyun - Spinning In The Plane</title>
    <!-- 아이콘 사용을 위한 FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            color: #222;
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 2px solid #eaeaea;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .album-art {
            width: 100%;
            max-width: 210px;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            margin-bottom: 20px;
            border: 2px solid #f0f0f0;
            animation: floatArt 4s ease-in-out infinite;
        }

        @keyframes floatArt {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .listen-to {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #00c756;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            margin: 0 0 8px;
            color: #111;
            letter-spacing: -0.5px;
        }

        p.artist {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            color: #222;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1.5px solid #eee;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-btn span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-btn i {
            font-size: 18px;
        }

        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: #00c756;
            background: #f4fff7;
            box-shadow: 0 6px 15px rgba(0, 199, 86, 0.12);
        }

        /* 플랫폼별 포인트 컬러 및 아이콘 색상 */
        .link-btn.spotify { border-left: 6px solid #1DB954; }
        .link-btn.spotify i { color: #1DB954; }
        
        .link-btn.apple { border-left: 6px solid #FA243C; }
        .link-btn.apple i { color: #FA243C; }
        
        .link-btn.melon { border-left: 6px solid #00CD3C; }
        .link-btn.melon i { color: #00CD3C; }
        
        .link-btn.genie { border-left: 6px solid #002D62; }
        .link-btn.genie i { color: #002D62; }
        
        .link-btn.bugs { border-left: 6px solid #FF1D32; }
        .link-btn.bugs i { color: #FF1D32; }

        /* 인스타그램 버튼 전용 스타일 */
        .link-btn.instagram { 
            border-left: 6px solid #E1306C; 
            background: #fafafa;
        }
        .link-btn.instagram i { color: #E1306C; }
        .link-btn.instagram:hover {
            background: #fff0f5;
            border-color: #E1306C;
            box-shadow: 0 6px 15px rgba(225, 48, 108, 0.12);
        }

        .insta-group {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 앨범 커버 이미지 -->
        <img src="cover.png" alt="Spinning In The Plane Artwork" class="album-art">
        
        <div class="listen-to">Listen to</div>
        <h1>Spinning in the Plane</h1>
        <p class="artist">by AGENDA, WHYAHYUN</p>
        
        <div class="link-list">
            <!-- 음원 플랫폼 링크들 -->
            <a href="https://open.spotify.com/album/4q3ZmnVvUyOzZCxuXJCdKp?si=R527rIoDRFi9nGu_xv94vg" target="_blank" class="link-btn spotify">
                <span><i class="fa-brands fa-spotify"></i> Spotify</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
            </a>
            <a href="https://music.apple.com/us/album/spinning-in-the-plane-single/6807306644?l=es-MX" target="_blank" class="link-btn apple">
                <span><i class="fa-brands fa-apple"></i> Apple Music</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
            </a>
            <a href="https://www.melon.com/album/detail.htm?albumId=14556600" target="_blank" class="link-btn melon">
                <span><i class="fa-solid fa-compact-disc"></i> Melon</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
            </a>
            <a href="https://www.genie.co.kr/detail/albumInfo?axnm=88166077" target="_blank" class="link-btn genie">
                <span><i class="fa-solid fa-music"></i> Genie</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
            </a>
            <a href="https://music.apple.com/us/album/spinning-in-the-plane-single/6807306644?l=es-MX" target="_blank" class="link-btn bugs">
                <span><i class="fa-solid fa-headphones"></i> Bugs</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
            </a>

            <!-- 인스타그램 버튼 그룹 -->
            <div class="insta-group">
                <a href="https://instagram.com/vpue6v" target="_blank" class="link-btn instagram">
                    <span><i class="fa-brands fa-instagram"></i> @vpue6v (AGENDA)</span>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
                </a>
                <a href="https://instagram.com/whyahyun" target="_blank" class="link-btn instagram">
                    <span><i class="fa-brands fa-instagram"></i> @whyahyun (WHYAHYUN)</span>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
