<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda & Whyahyun - Spinning In The Plane</title>
    <!-- 아이콘 사용을 위한 FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            /* 기본 백그라운드 그라데이션 */
            background: linear-gradient(135deg, #c7f5e1 0%, #b2e6ff 50%, #d4eaff 100%);
            color: #1a2e26;
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
            text-align: center;
            /* 모바일 화면에서 상하좌우 여백을 줄여 컨텐츠 가용 면적 극대화 */
            padding: 16px 12px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.52);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            /* 모바일에 맞게 내부 여백 조정 */
            padding: 24px 18px 20px 18px;
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 100, 150, 0.15), 
                        inset 0 0 25px rgba(255, 255, 255, 0.9),
                        inset 0 0 5px rgba(255, 255, 255, 1);
            border: 2px solid rgba(255, 255, 255, 0.9);
            animation: smoothSlideDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 컨테이너 박스 내부 뒤쪽에 딱 알맞은 크기로 들어가는 앨범 실루엣 레이어 */
        .container::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            background: url('cover.png') no-repeat center center;
            background-size: cover;
            opacity: 0.2;
            filter: blur(8px) saturate(1.3);
            border-radius: 22px;
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.03); }
        }

        @keyframes smoothSlideDown {
            0% { opacity: 0; transform: translateY(-40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 앨범 커버 래퍼 */
        .art-wrapper {
            margin-bottom: 18px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .album-art-container {
            width: 100%;
            /* 모바일 화면 비율에 맞춰 컴팩트하게 조정 */
            max-width: 180px;
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            transform: scale(1);
            transition: transform 0.08s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.9);
            display: block;
        }

        .album-art-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
            opacity: 0;
            transform: scale(0.2);
            pointer-events: none;
            animation: waterRipple 4s infinite cubic-bezier(0, 0.2, 0.8, 1);
        }

        @keyframes waterRipple {
            0% { transform: scale(0.2); opacity: 0.8; }
            50% { opacity: 0.3; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .album-art-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.15) 100%);
            border-radius: 16px;
            pointer-events: none;
        }

        .listen-to {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #007a46;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        h1 {
            font-size: 19px;
            font-weight: 800;
            margin: 0 0 6px;
            color: #111;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        p.artist {
            font-size: 12px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        /* 레트로 미니 MP3 플레이어 박스 스타일 */
        .preview-player-box {
            background: rgba(240, 250, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            padding: 10px 12px 12px 12px;
            margin-bottom: 16px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.95),
                        0 6px 15px rgba(0, 100, 150, 0.06);
            text-align: left;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 100, 150, 0.15);
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .player-title-text {
            font-size: 10px;
            font-weight: 800;
            color: #005588;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .window-controls {
            display: flex;
            gap: 3px;
        }

        .win-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(0, 100, 150, 0.25);
            display: inline-block;
        }

        .visualizer-screen {
            background: rgba(10, 30, 25, 0.88);
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .now-playing-label {
            font-family: monospace;
            font-size: 10px;
            color: #00ff88;
            text-shadow: 0 0 5px rgba(0,255,136,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .realtime-eq {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
        }

        .realtime-eq span {
            width: 2.5px;
            background: #00ff88;
            border-radius: 1px;
            height: 4px;
            transition: height 0.05s ease;
            box-shadow: 0 0 4px rgba(0,255,136,0.5);
        }

        .player-divider {
            width: 100%;
            height: 1px;
            background: rgba(0, 100, 150, 0.15);
            margin-bottom: 10px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.6);
        }

        .track-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .track-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 9px;
            padding: 8px 10px;
            font-size: 11.5px;
            font-weight: 700;
            color: #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03), inset 0 1px 2px rgba(255,255,255,0.9);
        }

        .track-btn span {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .track-btn:active {
            background: rgba(0, 199, 86, 0.85);
            color: #fff;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 링크 배너 스타일 (모바일 터치감 고려) */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #1a1a1a;
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 6px 16px rgba(0, 120, 180, 0.07),
                        inset 0 2px 4px rgba(255, 255, 255, 0.9),
                        inset 0 -2px 4px rgba(200, 225, 245, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            transform-origin: center center;
            transition: transform 0.15s ease, background 0.25s, box-shadow 0.25s, border-color 0.25s;
            position: relative;
            overflow: hidden;
        }

        .link-btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 5px; height: 5px;
            background: rgba(0, 255, 136, 0.4);
            opacity: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none;
            transition: none;
        }

        .link-btn.liquid-clicked::after {
            animation: liquidSplash 0.6s cubic-bezier(0, 0.2, 0.8, 1) forwards;
        }

        @keyframes liquidSplash {
            0% { width: 5px; height: 5px; opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { width: 300px; height: 300px; opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .link-btn span {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .link-btn i {
            font-size: 16px;
        }

        .link-btn.spotify i { color: #1DB954; }
        .link-btn.apple i { color: #FA243C; }
        .link-btn.melon i { color: #00CD3C; }
        .link-btn.genie i { color: #002D62; }
        .link-btn.bugs i { color: #FF1D32; }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0, 130, 200, 0.3), transparent);
            margin: 14px 0;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .insta-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .link-btn.instagram { 
            justify-content: center;
            padding: 11px 8px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.65);
        }
        
        .link-btn.instagram i { color: #E1306C; }

        /* 터치 디바이스 호환 스파크 효과 최적화 */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffffff 0%, rgba(0,200,100,0.8) 100%);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 6px #00ff88;
            animation: sparkleFade 0.5s linear forwards;
            z-index: 9999;
        }

        @keyframes sparkleFade {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.3) translateY(15px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 모바일 터치 및 마우스 스파크 효과 스크립트 -->
    <script>
        function createSparkle(x, y) {
            if (Math.random() > 0.4) {
                let sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 500);
            }
        }

        document.addEventListener('mousemove', function(e) {
            createSparkle(e.pageX, e.pageY);
        });

        document.addEventListener('touchmove', function(e) {
            if(e.touches && e.touches[0]) {
                createSparkle(e.touches[0].pageX, e.touches[0].pageY);
            }
        }, {passive: true});
    </script>

    <div class="container" id="mainContainer">
        <!-- 앨범 커버 -->
        <div class="art-wrapper">
            <div class="album-art-container" id="artContainer">
                <img src="cover.png" alt="Spinning In The Plane Artwork" class="album-art">
            </div>
        </div>
        
        <div class="listen-to">Listen to</div>
        <h1>Spinning in the Plane</h1>
        <p class="artist">by AGENDA, WHYAHYUN</p>

        <!-- AGWA_PREVIEW.mp3 레트로 미니 플레이어 칸 -->
        <div class="preview-player-box">
            <div class="player-header">
                <span class="player-title-text"><i class="fa-solid fa-compact-disc"></i> AGWA_PREVIEW.mp3</span>
                <div class="window-controls">
                    <span class="win-dot"></span>
                    <span class="win-dot"></span>
                    <span class="win-dot"></span>
                </div>
            </div>

            <!-- 디스플레이 스크린 & 실시간 이퀄라이저 바 -->
            <div class="visualizer-screen">
                <span class="now-playing-label" id="nowPlayingText">STANDBY...</span>
                <div class="realtime-eq" id="realtimeEq">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <!-- 구분선 -->
            <div class="player-divider"></div>

            <div class="track-buttons">
                <button class="track-btn" onclick="playAudio('track1.mp3', '1. 거짓말쟁이 (Liar)', this)">
                    <span><i class="fa-solid fa-play" style="color: #00c756;"></i> 1. 거짓말쟁이 (Liar)</span>
                    <span style="font-size: 9.5px; color: #555;">Preview</span>
                </button>
                <button class="track-btn" onclick="playAudio('track2.mp3', '2. 아무래도 (Whatever)', this)">
                    <span><i class="fa-solid fa-play" style="color: #00c756;"></i> 2. 아무래도 (Whatever)</span>
                    <span style="font-size: 9.5px; color: #555;">Preview</span>
                </button>
            </div>
        </div>

        <!-- 오디오 재생 및 저음역대 분석 스크립트 -->
        <audio id="audioPlayer" crossorigin="anonymous"></audio>
        <script>
            let currentAudio = document.getElementById('audioPlayer');
            let artContainer = document.getElementById('artContainer');
            let nowPlayingText = document.getElementById('nowPlayingText');
            let eqBars = document.querySelectorAll('#realtimeEq span');

            let audioCtx, analyser, source, dataArray, animationId;

            function initAudioAPI() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    source = audioCtx.createMediaElementSource(currentAudio);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    analyser.fftSize = 128;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function updateVisualizer() {
                if (!currentAudio.paused) {
                    analyser.getByteFrequencyData(dataArray);
                    
                    // 이퀄라이저 바 업데이트
                    for (let i = 0; i < eqBars.length; i++) {
                        let value = dataArray[i * 2] || 0;
                        let heightPercent = Math.max(4, (value / 255) * 14);
                        eqBars[i].style.height = heightPercent + 'px';
                    }

                    // 저음역대(인덱스 1~3번) 중심 앨범 커버 줌 반응
                    let bassSum = 0;
                    let bassRangeCount = 3;
                    for (let i = 1; i <= bassRangeCount; i++) {
                        bassSum += dataArray[i];
                    }
                    let bassAverage = bassSum / bassRangeCount;

                    let scaleValue = 1 + (bassAverage / 255) * 0.11;
                    artContainer.style.transform = `scale(${scaleValue})`;

                    animationId = requestAnimationFrame(updateVisualizer);
                }
            }

            function playAudio(file, trackName, btn) {
                initAudioAPI();

                if(currentAudio.src.includes(file) && !currentAudio.paused) {
                    currentAudio.pause();
                    btn.querySelector('i').className = "fa-solid fa-play";
                    cancelAnimationFrame(animationId);
                    artContainer.style.transform = 'scale(1)';
                    nowPlayingText.innerText = "PAUSED";
                } else {
                    currentAudio.src = file;
                    currentAudio.play().then(() => {
                        document.querySelectorAll('.track-btn i').forEach(i => i.className = "fa-solid fa-play");
                        btn.querySelector('i').className = "fa-solid fa-pause";
                        nowPlayingText.innerText = "▶ " + trackName;
                        cancelAnimationFrame(animationId);
                        updateVisualizer();
                    }).catch(e => {
                        alert("깃허브 저장소에 미리듣기 음원 파일('" + file + "')을 업로드해 주시면 정상적으로 재생됩니다!");
                    });
                }
            }
            
            currentAudio.onended = function() {
                document.querySelectorAll('.track-btn i').forEach(i => i.className = "fa-solid fa-play");
                cancelAnimationFrame(animationId);
                artContainer.style.transform = 'scale(1)';
                nowPlayingText.innerText = "READY";
                eqBars.forEach(bar => bar.style.height = '4px');
            };

            // 링크 배너 인터랙션
            document.querySelectorAll('.link-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    let targetUrl = this.getAttribute('href');

                    this.classList.add('liquid-clicked');
                    
                    this.style.transform = 'scaleX(1.1) scaleY(0.88)';
                    setTimeout(() => {
                        this.style.transform = 'scaleX(0.94) scaleY(1.1)';
                    }, 100);
                    setTimeout(() => {
                        this.style.transform = 'scaleX(1.03) scaleY(0.97)';
                    }, 200);

                    let container = document.getElementById('mainContainer');
                    container.style.transform = 'scale(0.98) translateY(2px)';

                    setTimeout(() => {
                        window.open(targetUrl, '_blank');
                        this.classList.remove('liquid-clicked');
                        this.style.transform = 'scale(1)';
                        container.style.transform = 'scale(1) translateY(0)';
                    }, 350);
                });
            });
        </script>
        
        <div class="divider"></div>

        <div class="link-list">
            <!-- 음원 플랫폼 링크들 -->
            <a href="https://open.spotify.com/album/4q3ZmnVvUyOzZCxuXJCdKp?si=R527rIoDRFi9nGu_xv94vg" target="_blank" class="link-btn spotify">
                <span><i class="fa-brands fa-spotify"></i> Spotify</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #777;"></i>
            </a>
            <a href="https://music.apple.com/us/album/spinning-in-the-plane-single/6807306644?l=es-MX" target="_blank" class="link-btn apple">
                <span><i class="fa-brands fa-apple"></i> Apple Music</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #777;"></i>
            </a>
            <a href="https://www.melon.com/album/detail.htm?albumId=14556600" target="_blank" class="link-btn melon">
                <span><i class="fa-solid fa-compact-disc"></i> Melon</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #777;"></i>
            </a>
            <a href="https://www.genie.co.kr/detail/albumInfo?axnm=88166077" target="_blank" class="link-btn genie">
                <span><i class="fa-solid fa-music"></i> Genie</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #777;"></i>
            </a>
            <a href="https://music.bugs.co.kr/album/4155090?wl_ref=list_tr_11_search" target="_blank" class="link-btn bugs">
                <span><i class="fa-solid fa-headphones"></i> Bugs</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #777;"></i>
            </a>

            <!-- 구분선 -->
            <div class="divider"></div>

            <!-- 인스타그램 버튼 (한 줄에 2개) -->
            <div class="insta-group">
                <a href="https://instagram.com/vpue6v" target="_blank" class="link-btn instagram">
                    <span><i class="fa-brands fa-instagram"></i> AGENDA</span>
                </a>
                <a href="https://instagram.com/whyahyun" target="_blank" class="link-btn instagram">
                    <span><i class="fa-brands fa-instagram"></i> WHYAHYUN</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
