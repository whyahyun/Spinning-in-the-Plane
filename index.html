<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Whyahyun - Spinning In The Plane</title>
    <!-- 아이콘 사용을 위한 FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            /* 싱그러운 그린과 아쿠아 블루가 흐르는 배경 애니메이션 */
            background: linear-gradient(135deg, #d4f8e8 0%, #c2eeff 50%, #e0f0ff 100%);
            background-size: 200% 200%;
            animation: gradientFlow 12s ease infinite;
            color: #1a2e26;
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            /* 완전 맑고 투명한 유리 판넬 느낌 */
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 22px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 120, 180, 0.15), 
                        inset 0 0 30px rgba(255, 255, 255, 0.8),
                        inset 0 0 5px rgba(255, 255, 255, 1);
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: smoothSlideDown 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 2;
        }

        @keyframes smoothSlideDown {
            0% { opacity: 0; transform: translateY(-80px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 앨범 커버 래퍼 */
        .art-wrapper {
            margin-bottom: 22px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .album-art-container {
            width: 100%;
            max-width: 210px;
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transform: scale(1);
            transition: transform 0.1s ease;
        }

        /* 음악 재생 시 비트에 맞춰 쿵-쿵 뛰는 오디오 리액티브 펄스 클래스 */
        .album-art-container.playing {
            animation: audioPulse 0.6s infinite alternate ease-in-out;
        }

        @keyframes audioPulse {
            0% { transform: scale(1); box-shadow: 0 12px 30px rgba(0, 199, 86, 0.2); }
            100% { transform: scale(1.05); box-shadow: 0 18px 40px rgba(0, 199, 86, 0.4); }
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.9);
            display: block;
        }

        /* 맑고 투명한 아쿠아 리플(물결 파동) 오버레이 효과 */
        .album-art-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
            opacity: 0;
            transform: scale(0.2);
            pointer-events: none;
            animation: waterRipple 4s infinite cubic-bezier(0, 0.2, 0.8, 1);
        }

        @keyframes waterRipple {
            0% { transform: scale(0.2); opacity: 0.8; }
            50% { opacity: 0.3; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .album-art-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.15) 100%);
            border-radius: 18px;
            pointer-events: none;
        }

        .listen-to {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #007a46;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            margin: 0 0 8px;
            color: #111;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        p.artist {
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        /* 레트로 미니 MP3 플레이어 박스 스타일 */
        .preview-player-box {
            background: rgba(240, 250, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 10px 14px 14px 14px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.95),
                        0 8px 20px rgba(0, 100, 150, 0.08);
            text-align: left;
        }

        /* 윈도우 미니 창 타이틀 바 느낌 */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 100, 150, 0.15);
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .player-title-text {
            font-size: 11px;
            font-weight: 800;
            color: #005588;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .win-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 100, 150, 0.25);
            display: inline-block;
        }

        /* 액티브 비주얼라이저 (주파수 바) */
        .visualizer-screen {
            background: rgba(10, 30, 25, 0.85);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }

        .now-playing-label {
            font-family: monospace;
            font-size: 11px;
            color: #00ff88;
            text-shadow: 0 0 6px rgba(0,255,136,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .mini-eq {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
        }

        .mini-eq span {
            width: 2.5px;
            background: #00ff88;
            border-radius: 1px;
            animation: none;
        }

        /* 재생 중일 때만 움직이는 이퀄라이저 애니메이션 */
        .playing-eq span:nth-child(1) { animation: eqBounce 0.5s infinite alternate ease-in-out; height: 4px; }
        .playing-eq span:nth-child(2) { animation: eqBounce 0.4s infinite alternate ease-in-out 0.1s; height: 10px; }
        .playing-eq span:nth-child(3) { animation: eqBounce 0.6s infinite alternate ease-in-out 0.2s; height: 6px; }
        .playing-eq span:nth-child(4) { animation: eqBounce 0.45s infinite alternate ease-in-out 0.15s; height: 12px; }
        .playing-eq span:nth-child(5) { animation: eqBounce 0.55s infinite alternate ease-in-out 0.05s; height: 8px; }

        @keyframes eqBounce {
            0% { height: 3px; }
            100% { height: 14px; }
        }

        .track-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04), inset 0 1px 2px rgba(255,255,255,0.9);
        }

        .track-btn span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track-btn:hover {
            background: rgba(0, 199, 86, 0.85);
            color: #fff;
            border-color: rgba(255,255,255,0.9);
            box-shadow: 0 4px 12px rgba(0, 199, 86, 0.3);
        }
        
        .track-btn:hover span {
            color: #fff;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 완전히 투명하고 영롱한 아크릴 버튼 스타일 */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #1a1a1a;
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(0, 120, 180, 0.08),
                        inset 0 2px 4px rgba(255, 255, 255, 0.9),
                        inset 0 -2px 4px rgba(200, 225, 245, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-btn span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-btn i {
            font-size: 18px;
        }

        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(0, 199, 86, 0.9);
            box-shadow: 0 12px 25px rgba(0, 199, 86, 0.2),
                        inset 0 2px 5px rgba(255, 255, 255, 1);
        }

        .link-btn.spotify i { color: #1DB954; }
        .link-btn.apple i { color: #FA243C; }
        .link-btn.melon i { color: #00CD3C; }
        .link-btn.genie i { color: #002D62; }
        .link-btn.bugs i { color: #FF1D32; }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0, 130, 200, 0.3), transparent);
            margin: 18px 0;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .insta-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .link-btn.instagram { 
            justify-content: center;
            padding: 13px 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.45);
        }
        
        .link-btn.instagram i { color: #E1306C; }

        .link-btn.instagram:hover {
            background: rgba(255, 255, 255, 0.75);
            border-color: #E1306C;
            box-shadow: 0 12px 25px rgba(225, 48, 108, 0.2),
                        inset 0 2px 5px rgba(255, 255, 255, 1);
        }

        /* 마우스 스파크 효과 */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffffff 0%, rgba(0,200,100,0.8) 100%);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #00ff88;
            animation: sparkleFade 0.6s linear forwards;
            z-index: 9999;
        }

        @keyframes sparkleFade {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.3) translateY(20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 마우스 스파크 효과 스크립트 -->
    <script>
        document.addEventListener('mousemove', function(e) {
            if (Math.random() > 0.3) {
                let sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = e.pageX + 'px';
                sparkle.style.top = e.pageY + 'px';
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 600);
            }
        });
    </script>

    <div class="container">
        <!-- 앨범 커버 (물결 리플 + 오디오 리액티브 펄스) -->
        <div class="art-wrapper">
            <div class="album-art-container" id="artContainer">
                <img src="cover.png" alt="Spinning In The Plane Artwork" class="album-art">
            </div>
        </div>
        
        <div class="listen-to">Listen to</div>
        <h1>Spinning in the Plane</h1>
        <p class="artist">by AGENDA, WHYAHYUN</p>

        <!-- AGWA_PREVIEW.mp3 레트로 미니 플레이어 칸 -->
        <div class="preview-player-box">
            <div class="player-header">
                <span class="player-title-text"><i class="fa-solid fa-compact-disc"></i> AGWA_PREVIEW.mp3</span>
                <div class="window-controls">
                    <span class="win-dot"></span>
                    <span class="win-dot"></span>
                    <span class="win-dot"></span>
                </div>
            </div>

            <!-- 디스플레이 스크린 & 이퀄라이저 바 -->
            <div class="visualizer-screen">
                <span class="now-playing-label" id="nowPlayingText">STANDBY...</span>
                <div class="mini-eq" id="miniEq">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="track-buttons">
                <button class="track-btn" onclick="playAudio('track1.mp3', '1. 거짓말쟁이 (Liar)', this)">
                    <span><i class="fa-solid fa-play" style="color: #00c756;"></i> 1. 거짓말쟁이 (Liar)</span>
                    <span style="font-size: 10px; color: #555;">Preview</span>
                </button>
                <button class="track-btn" onclick="playAudio('track2.mp3', '2. 아무래도 (Whatever)', this)">
                    <span><i class="fa-solid fa-play" style="color: #00c756;"></i> 2. 아무래도 (Whatever)</span>
                    <span style="font-size: 10px; color: #555;">Preview</span>
                </button>
            </div>
        </div>

        <!-- 오디오 재생 및 플레이어 제어 스크립트 -->
        <audio id="audioPlayer"></audio>
        <script>
            let currentAudio = document.getElementById('audioPlayer');
            let artContainer = document.getElementById('artContainer');
            let nowPlayingText = document.getElementById('nowPlayingText');
            let miniEq = document.getElementById('miniEq');

            function playAudio(file, trackName, btn) {
                if(currentAudio.src.includes(file) && !currentAudio.paused) {
                    currentAudio.pause();
                    btn.querySelector('i').className = "fa-solid fa-play";
                    artContainer.classList.remove('playing');
                    miniEq.classList.remove('playing-eq');
                    nowPlayingText.innerText = "PAUSED";
                } else {
                    currentAudio.src = file;
                    currentAudio.play().then(() => {
                        document.querySelectorAll('.track-btn i').forEach(i => i.className = "fa-solid fa-play");
                        btn.querySelector('i').className = "fa-solid fa-pause";
                        artContainer.classList.add('playing');
                        miniEq.classList.add('playing-eq');
                        nowPlayingText.innerText = "▶ " + trackName;
                    }).catch(e => {
                        alert("깃허브 저장소에 미리듣기 음원 파일('" + file + "')을 업로드해 주시면 정상적으로 재생됩니다!");
                    });
                }
            }
            
            currentAudio.onended = function() {
                document.querySelectorAll('.track-btn i').forEach(i => i.className = "fa-solid fa-play");
                artContainer.classList.remove('playing');
                miniEq.classList.remove('playing-eq');
                nowPlayingText.innerText = "READY";
            };
        </script>
        
        <!-- 미리듣기와 음원 사이트 사이 구분선 (격자선) 추가 -->
        <div class="divider"></div>

        <div class="link-list">
            <!-- 음원 플랫폼 링크들 -->
            <a href="https://open.spotify.com/album/4q3ZmnVvUyOzZCxuXJCdKp?si=R527rIoDRFi9nGu_xv94vg" target="_blank" class="link-btn spotify">
                <span><i class="fa-brands fa-spotify"></i> Spotify</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #777;"></i>
            </a>
            <a href="https://music.apple.com/us/album/spinning-in-the-plane-single/6807306644?l=es-MX" target="_blank" class="link-btn apple">
                <span><i class="fa-brands fa-apple"></i> Apple Music</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #777;"></i>
            </a>
            <a href="https://www.melon.com/album/detail.htm?albumId=14556600" target="_blank" class="link-btn melon">
                <span><i class="fa-solid fa-compact-disc"></i> Melon</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #777;"></i>
            </a>
            <a href="https://www.genie.co.kr/detail/albumInfo?axnm=88166077" target="_blank" class="link-btn genie">
                <span><i class="fa-solid fa-music"></i> Genie</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #777;"></i>
            </a>
            <a href="https://music.bugs.co.kr/album/4155090?wl_ref=list_tr_11_search" target="_blank" class="link-btn bugs">
                <span><i class="fa-solid fa-headphones"></i> Bugs</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #777;"></i>
            </a>

            <!-- 구분선 -->
            <div class="divider"></div>

            <!-- 인스타그램 버튼 (한 줄에 2개) -->
            <div class="insta-group">
                <a href="https://instagram.com/vpue6v" target="_blank" class="link-btn instagram">
                    <span><i class="fa-brands fa-instagram"></i> AGENDA</span>
                </a>
                <a href="https://instagram.com/whyahyun" target="_blank" class="link-btn instagram">
                    <span><i class="fa-brands fa-instagram"></i> WHYAHYUN</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
