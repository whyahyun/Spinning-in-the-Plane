<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda,Whyahyun - Spinning in the Plane [DS]</title>
    
    <!-- Open Graph (OG) 태그 설정 -->
    <meta property="og:title" content="Agenda,Whyahyun - Spinning in the Plane [DS]">
    <meta property="og:description" content="Double Single Album [Spinning in the Plane] Listen & Streaming Links">
    <meta property="og:image" content="cover.png">
    
    <!-- 아이콘 사용을 위한 FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 50% 20%, #f4f6f8 0%, #e2e7ec 60%, #c8d0d8 100%);
            color: #1e293b;
            font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
            text-align: center;
            padding: 8px 12px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: default;
            position: relative;
        }

        /* 1. 뒷배경 앨범 커버: 화이트 톤을 기반으로 밝고 세련된 블랙&화이트 흑백 톤 적용 */
        body::before {
            content: '';
            position: fixed;
            top: -15vh; left: -15vw; right: -15vw; bottom: -15vh;
            background: url('cover.png') no-repeat center center;
            background-size: cover;
            opacity: 0.35;
            filter: grayscale(100%) contrast(120%) brightness(1.35) blur(22px);
            z-index: 0;
            pointer-events: none;
            transform: scale(var(--bg-scale, 1));
            transition: transform 0.04s ease-out;
        }

        /* 중앙 글래스 배너 프레임 */
        .container {
            width: 100%;
            max-width: 330px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(240, 248, 255, 0.55) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 16px 14px 14px 14px;
            border-radius: 26px;
            box-shadow: 0 20px 50px rgba(0, 70, 120, 0.15), 
                        inset 0 2px 5px rgba(255, 255, 255, 1),
                        inset 0 -3px 8px rgba(0, 120, 180, 0.1),
                        0 0 0 1.5px rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        /* 2. 테트리스처럼 엉망진창으로 쏟아졌다가 제자리를 찾는 파편별 개별 중력 애니메이션 */
        
        /* 앨범 아트: 왼쪽에서 비틀거리며 뚝 떨어짐 */
        .art-wrapper {
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            animation: tetrisFallArt 2.4s cubic-bezier(0.18, 1.35, 0.3, 1) forwards;
        }
        @keyframes tetrisFallArt {
            0% { opacity: 0; transform: translateY(-130vh) rotate(-35deg) scale(0.5); }
            50% { opacity: 1; transform: translateY(35px) rotate(12deg) scale(1.1, 0.8); }
            75% { transform: translateY(-15px) rotate(-6deg) scale(0.95, 1.05); }
            90% { transform: translateY(5px) rotate(2deg) scale(1.02, 0.98); }
            100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        }

        .album-art-container {
            width: 100%;
            max-width: 135px;
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 90, 150, 0.15), inset 0 0 0 1px rgba(255,255,255,0.8);
            overflow: visible;
            transform-style: preserve-3d;
            animation: albumFlip 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes albumFlip {
            0% { transform: rotateY(0deg); box-shadow: 0 10px 25px rgba(0, 90, 150, 0.15); }
            30% { transform: rotateY(360deg); box-shadow: 0 14px 30px rgba(0, 150, 210, 0.25); }
            100% { transform: rotateY(360deg); box-shadow: 0 10px 25px rgba(0, 90, 150, 0.15); }
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
            border: 2.5px solid rgba(255, 255, 255, 0.95);
            display: block;
        }

        /* 텍스트 그룹: 오른쪽으로 기울어져 와르르 떨어짐 */
        .text-group {
            animation: tetrisFallText 2.6s cubic-bezier(0.15, 1.3, 0.3, 1) forwards;
        }
        @keyframes tetrisFallText {
            0% { opacity: 0; transform: translateY(-110vh) rotate(25deg) scaleY(1.3); }
            53% { opacity: 1; transform: translateY(28px) rotate(-8deg) scaleY(0.75); }
            78% { transform: translateY(-10px) rotate(3deg) scaleY(1.05); }
            100% { opacity: 1; transform: translateY(0) rotate(0deg) scaleY(1); }
        }

        .listen-to {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #007a46;
            text-transform: uppercase;
            margin-bottom: 2px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
        }

        h1 {
            font-size: 16.5px;
            font-weight: 800;
            margin: 0 0 2px;
            color: #11261d;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
        }

        p.artist {
            font-size: 11.5px;
            color: #1a382d;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
        }

        /* 프리뷰 플레이어 박스: 무거운 블록이 떨어지듯 쿵 떨어짐 */
        .preview-player-box {
            background: linear-gradient(135deg, rgba(245, 253, 255, 0.85) 0%, rgba(215, 242, 255, 0.55) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            padding: 8px 10px;
            margin-bottom: 2px;
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 1),
                        0 6px 16px rgba(0, 110, 170, 0.06);
            text-align: center;
            animation: tetrisFallBox 2.8s cubic-bezier(0.12, 1.25, 0.3, 1) forwards;
        }
        @keyframes tetrisFallBox {
            0% { opacity: 0; transform: translateY(-90vh) rotate(-15deg); }
            56% { opacity: 1; transform: translateY(22px) rotate(5deg); }
            80% { transform: translateY(-8px) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) rotate(0deg); }
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 0 2px;
        }

        .preview-badge {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #00b050 0%, #008040 100%);
            padding: 2.5px 6px;
            border-radius: 5px;
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0, 150, 80, 0.25);
        }

        .visualizer-screen {
            background: rgba(255, 255, 255, 0.65);
            border-radius: 7px;
            padding: 5px 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        .now-playing-label {
            font-family: monospace;
            font-size: 9px;
            color: #006633;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .realtime-eq {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 9px;
        }

        .realtime-eq span {
            width: 2px;
            background: #008a4c;
            border-radius: 1px;
            height: 3px;
            transition: height 0.02s ease;
        }

        .preview-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 2px;
            margin-bottom: 6px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        .preview-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00b359, #00e673);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 0 4px;
        }

        .track-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(230, 245, 255, 0.75) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 8px;
            padding: 6px 4px;
            font-size: 10px;
            font-weight: 700;
            color: #1a2e26;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.12s ease;
            box-shadow: 0 3px 8px rgba(0, 100, 150, 0.06), inset 0 1px 2px rgba(255, 255, 255, 1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-btn:active {
            background: rgba(0, 199, 86, 0.9);
            color: #fff;
            transform: scale(0.93);
        }

        /* 구분선 */
        .divider {
            width: 100%;
            height: 1.5px;
            background: linear-gradient(to right, transparent, rgba(0, 140, 220, 0.3), transparent);
            margin: 11px 0;
            box-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }

        /* 음원 사이트 버튼 영역: 마지막 파편들이 흩어졌다가 합쳐짐 */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            width: 100%;
            animation: tetrisFallLinks 3.0s cubic-bezier(0.1, 1.2, 0.3, 1) forwards;
        }
        @keyframes tetrisFallLinks {
            0% { opacity: 0; transform: translateY(-70vh) rotate(18deg); }
            60% { opacity: 1; transform: translateY(18px) rotate(-4deg); }
            82% { transform: translateY(-6px) rotate(1deg); }
            100% { opacity: 1; transform: translateY(0) rotate(0deg); }
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 180px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(215, 242, 255, 0.55) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #122b20;
            text-decoration: none;
            padding: 6.5px 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            box-shadow: 0 4px 12px rgba(0, 110, 180, 0.08),
                        inset 0 1.5px 4px rgba(255, 255, 255, 1),
                        inset 0 -2px 4px rgba(0, 130, 200, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            white-space: nowrap;
            cursor: pointer;
            transform-origin: center center;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .link-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(230, 248, 255, 0.8) 100%);
            box-shadow: 0 6px 16px rgba(0, 140, 220, 0.18),
                        inset 0 2px 5px rgba(255, 255, 255, 1);
        }

        .link-btn.clicked {
            animation: waterBounce 0.4s cubic-bezier(0.36, 1.6, 0.4, 1) forwards;
        }

        @keyframes waterBounce {
            0% { transform: scale(1); }
            35% { 
                transform: scale(1.12) translateY(-2px); 
                background: linear-gradient(135deg, rgba(255, 255, 255, 1) 0%, rgba(180, 230, 255, 0.9) 100%);
                box-shadow: 0 10px 25px rgba(0, 160, 255, 0.35), inset 0 0 10px rgba(255, 255, 255, 1);
            }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .insta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 180px;
            margin: 0 auto;
            animation: tetrisFallLinks 3.1s cubic-bezier(0.1, 1.2, 0.3, 1) forwards;
        }

        .insta-grid .link-btn {
            width: 100%;
        }

        .link-btn i {
            font-size: 13px;
        }

        .link-btn.spotify i { color: #1DB954; }
        .link-btn.apple i { color: #FA243C; }
        .link-btn.melon i { color: #00CD3C; }
        .link-btn.genie i { color: #002D62; }
        .link-btn.bugs i { color: #FF1D32; }
        .link-btn.instagram i { color: #E1306C; }

        /* 워터리한 물방울 터치 효과 */
        .water-drop {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(120, 210, 255, 0.4) 60%, rgba(0, 140, 220, 0.15) 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.2);
            box-shadow: 0 4px 18px rgba(0, 130, 200, 0.25), inset 0 2px 5px rgba(255, 255, 255, 1);
            animation: waterDropRipple 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 9999;
        }

        @keyframes waterDropRipple {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; filter: blur(2px); }
        }
    </style>
</head>
<body>

    <script>
        function createWaterDrop(x, y) {
            if (Math.random() > 0.25) {
                let drop = document.createElement('div');
                drop.className = 'water-drop';
                let size = Math.floor(Math.random() * 20) + 40;
                drop.style.width = size + 'px';
                drop.style.height = size + 'px';
                drop.style.left = x + 'px';
                drop.style.top = y + 'px';
                document.body.appendChild(drop);
                setTimeout(() => drop.remove(), 650);
            }
        }

        document.addEventListener('mousemove', function(e) {
            createWaterDrop(e.pageX, e.pageY);
        });

        document.addEventListener('touchmove', function(e) {
            if(e.touches && e.touches[0]) {
                createWaterDrop(e.touches[0].pageX, e.touches[0].pageY);
            }
        }, {passive: true});
        
        document.addEventListener('touchstart', function(e) {
            if(e.touches && e.touches[0]) {
                createWaterDrop(e.touches[0].pageX, e.touches[0].pageY);
            }
        }, {passive: true});
    </script>

    <div class="container" id="mainContainer">
        <div class="art-wrapper">
            <div class="album-art-container" id="artContainer">
                <img src="cover.png" alt="Spinning In The Plane Artwork" class="album-art">
            </div>
        </div>
        
        <div class="text-group">
            <div class="listen-to">Listen to</div>
            <h1>Spinning in the Plane</h1>
            <p class="artist">by AGENDA, WHYAHYUN</p>
        </div>

        <!-- 30초 프리뷰 플레이어 박스 -->
        <div class="preview-player-box">
            <div class="preview-header">
                <span class="preview-badge"><i class="fa-solid fa-headphones"></i> 30s Preview</span>
                <span class="now-playing-label" id="nowPlayingText">STANDBY</span>
            </div>

            <div class="visualizer-screen">
                <span style="font-size: 8.5px; color: #007a46; font-weight: 800; letter-spacing: 0.5px;">PLAYING...</span>
                <div class="realtime-eq" id="realtimeEq">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <!-- 30초 진행률 바 -->
            <div class="preview-progress-container">
                <div class="preview-progress-bar" id="previewProgressBar"></div>
            </div>

            <div class="track-buttons">
                <button class="track-btn" onclick="playAudio('track1.mp3', '01. 거짓말쟁이', this)">
                    <i class="fa-solid fa-play" style="color: #00c756;"></i> 1. 거짓말쟁이
                </button>
                <button class="track-btn" onclick="playAudio('track2.mp3', '02. 아무래도', this)">
                    <i class="fa-solid fa-play" style="color: #00c756;"></i> 2. 아무래도
                </button>
            </div>
        </div>

        <audio id="audioPlayer" crossorigin="anonymous"></audio>
        <script>
            let currentAudio = document.getElementById('audioPlayer');
            let nowPlayingText = document.getElementById('nowPlayingText');
            let progressBar = document.getElementById('previewProgressBar');
            let eqBars = document.querySelectorAll('#realtimeEq span');
            let documentBody = document.body;

            let audioCtx, analyser, source, gainNode, dataArray, animationId, fadeTimer;

            function initAudioAPI() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    gainNode = audioCtx.createGain();
                    
                    source = audioCtx.createMediaElementSource(currentAudio);
                    
                    source.connect(gainNode);
                    gainNode.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    
                    analyser.fftSize = 128;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function updateVisualizer() {
                if (!currentAudio.paused) {
                    analyser.getByteFrequencyData(dataArray);
                    
                    for (let i = 0; i < eqBars.length; i++) {
                        let value = dataArray[i * 2] || 0;
                        let heightPercent = Math.max(3, (value / 255) * 10);
                        eqBars[i].style.height = heightPercent + 'px';
                    }

                    let bassSum = 0;
                    for (let i = 0; i < 4; i++) {
                        bassSum += dataArray[i];
                    }
                    let bassAvg = bassSum / 4; 
                    let dynamicScale = 1.0 + (bassAvg / 255) * 0.18;

                    documentBody.style.setProperty('--bg-scale', dynamicScale);

                    let percent = Math.min(100, (currentAudio.currentTime / 30) * 100);
                    progressBar.style.width = percent + '%';

                    animationId = requestAnimationFrame(updateVisualizer);
                }
            }

            function resetPlayerState() {
                if (fadeTimer) clearTimeout(fadeTimer);
                if (gainNode) gainNode.gain.setValueAtTime(1.0, audioCtx ? audioCtx.currentTime : 0);
                cancelAnimationFrame(animationId);
                documentBody.style.setProperty('--bg-scale', '1.0');
                document.querySelectorAll('.track-btn i').forEach(i => i.className = "fa-solid fa-play");
                nowPlayingText.innerText = "STANDBY";
                progressBar.style.width = '0%';
                eqBars.forEach(bar => bar.style.height = '3px');
            }

            function playAudio(file, trackInfo, btn) {
                initAudioAPI();
                resetPlayerState();

                if(currentAudio.src.includes(file) && !currentAudio.paused) {
                    currentAudio.pause();
                } else {
                    currentAudio.src = file;
                    currentAudio.currentTime = 0;
                    currentAudio.play().then(() => {
                        btn.querySelector('i').className = "fa-solid fa-pause";
                        nowPlayingText.innerText = trackInfo;
                        updateVisualizer();

                        fadeTimer = setTimeout(() => {
                            if (!currentAudio.paused) {
                                let now = audioCtx.currentTime;
                                gainNode.gain.setValueAtTime(1.0, now);
                                gainNode.gain.linearRampToValueAtTime(0.0, now + 3.0);

                                setTimeout(() => {
                                    currentAudio.pause();
                                    resetPlayerState();
                                }, 3000);
                            }
                        }, 27000);

                    }).catch(e => {
                        alert("깃허브 저장소에 미리듣기 음원 파일('" + file + "')을 업로드해 주시면 정상적으로 재생됩니다!");
                    });
                }
            }
            
            currentAudio.onended = function() {
                resetPlayerState();
            };

            document.querySelectorAll('.link-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    let targetUrl = this.getAttribute('href');
                    
                    this.classList.remove('clicked');
                    void this.offsetWidth; 
                    this.classList.add('clicked');

                    setTimeout(() => {
                        window.open(targetUrl, '_blank');
                    }, 220);
                });
            });
        </script>
        
        <!-- 구분선 -->
        <div class="divider"></div>

        <!-- 음원 사이트 영역 -->
        <div class="links-container">
            <a href="https://open.spotify.com/album/4q3ZmnVvUyOzZCxuXJCdKp?si=R527rIoDRFi9nGu_xv94vg" target="_blank" class="link-btn spotify">
                <i class="fa-brands fa-spotify"></i> Spotify
            </a>
            <a href="https://music.apple.com/us/album/spinning-in-the-plane-single/6807306644?l=es-MX" target="_blank" class="link-btn apple">
                <i class="fa-brands fa-apple"></i> Apple Music
            </a>
            <a href="https://www.melon.com/album/detail.htm?albumId=14556600" target="_blank" class="link-btn melon">
                <i class="fa-solid fa-compact-disc"></i> Melon
            </a>
            <a href="https://www.genie.co.kr/detail/albumInfo?axnm=88166077" target="_blank" class="link-btn genie">
                <i class="fa-solid fa-music"></i> Genie Music
            </a>
            <a href="https://music.bugs.co.kr/album/4155090?wl_ref=list_tr_11_search" target="_blank" class="link-btn bugs">
                <i class="fa-solid fa-headphones"></i> Bugs
            </a>
        </div>

        <!-- 구분선 -->
        <div class="divider"></div>

        <!-- 아티스트 인스타 소개 영역 -->
        <div class="insta-grid">
            <a href="https://instagram.com/vpue6v" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i> AGENDA
            </a>
            <a href="https://instagram.com/whyahyun" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i> WHYAHYUN
            </a>
        </div>
    </div>

</body>
</html>
